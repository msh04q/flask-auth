services:
  web:
    image: ghcr.io/msh04q/flask-auth:latest
    ports:
      - "5000:5000"
    env_file:
      - .env
    volumes:
      - instance_data:/app/instance
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health')"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  instance_data:
    name: flask-auth_instance_data