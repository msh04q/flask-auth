---
- hosts: all
  become: true
  tasks:
    # 1. Установка Docker (официальный репозиторий)
    - name: Install prerequisites
      apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - ufw
        state: present
        update_cache: true

    - name: Add Docker GPG key
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Add Docker repository
      apt_repository:
        repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present

    - name: Install Docker and Compose plugin
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: Ensure Docker is running
      service:
        name: docker
        state: started
        enabled: true

    # 2. Настройка UFW
    - name: Allow SSH
      community.general.ufw:
        rule: allow
        port: '22'
        proto: tcp

    - name: Allow HTTP (for future Nginx)
      community.general.ufw:
        rule: allow
        port: '80'
        proto: tcp

    - name: Enable UFW with deny incoming default
      community.general.ufw:
        state: enabled
        policy: deny
        direction: incoming
    
    # 3. Создаём пользователя для деплоя
    - name: Create deploy user
      ansible.builtin.user:
        name: deployer
        shell: /bin/bash
        create_home: true
        groups: sudo
        append: true

    # 4. Добавляем публичный ключ для deployer
    - name: Add SSH key for deployer
      ansible.posix.authorized_key:
        user: deployer
        state: present
        key: "{{ lookup('file', '/home/makbul/.ssh/flask_auth_deploy.pub') }}"

    - name: Allow deployer passwordless sudo
      community.general.sudoers:
        name: deployer-nopasswd
        state: present
        user: deployer
        commands: ALL
        nopassword: true
  
    # 5. Создание каталога приложения
    - name: Create app directory
      file:
        path: /opt/flask-auth
        state: directory
        owner: deployer
        group: deployer
        mode: '0755'
 
    # 6. Запрещаем прямой SSH-вход для root
    - name: Disable root SSH login
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?PermitRootLogin'
        line: 'PermitRootLogin no'
        state: present
        validate: '/usr/sbin/sshd -t -f %s'
      notify: Restart SSH

    # 7. Каталог для named volume instance_data и права для пользователя app (UID 1000)
    - name: Create instance volume directory on host
      file:
        path: /var/lib/docker/volumes/flask-auth_instance_data/_data
        state: directory
        owner: "1000"
        group: "1000"
        mode: '0755'

  handlers:
    - name: Restart SSH
      ansible.builtin.service:
        name: ssh
        state: restarted